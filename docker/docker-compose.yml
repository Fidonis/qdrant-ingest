# Standalone local deployment: the ingester plus its Tika sidecar.
# The embeddings endpoint is external — point QI_EMBEDDING_API_URL at a
# reachable instance via docker/.env, and set QI_CONNECTIONS_SECRET there too.
# The Qdrant instances jobs write to are declared in connections.yaml, not in
# the environment.
services:

  qdrant-ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: qdrant-ingest:v1.0.0
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - path: .env
        required: false
    environment:
      QI_TIKA_URL: http://tika:9998
    ports:
      - "${QI_HTTP_PORT:-8300}:${QI_HTTP_PORT:-8300}"
    volumes:
      - qi-cache:/data/cache
      - qi-state:/data/state
      # jobs.yaml, connections.yaml and secrets.yaml live in the catalog/
      # subdirectory. The ingester only reads them; they are edited on the host
      # or by papaia-manager. The container starts degraded but healthy while
      # the files are missing.
      - ${QI_CONFIG_DIR:-./config}:/config:ro
    depends_on:
      - tika

  tika:
    image: docker.io/apache/tika:3.2.3.0
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx${QI_TIKA_HEAP:-2g}"

volumes:
  qi-cache:
  qi-state:
