# Standalone local deployment: the ingester plus its Tika sidecar.
# The embeddings endpoint is external — point QI_EMBEDDING_API_URL at a
# reachable instance via docker/.env, and set QI_CONNECTIONS_SECRET there too.
# The Qdrant instances jobs write to are declared in connections.yaml (managed
# from the web interface), not in the environment.
services:

  qdrant-ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: qdrant-ingest:v0.3.0
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - path: .env
        required: false
    environment:
      QI_TIKA_URL: http://tika:9998
    ports:
      - "${QI_HTTP_PORT:-8300}:${QI_HTTP_PORT:-8300}"
    volumes:
      - qi-cache:/data/cache
      - qi-state:/data/state
      # The bundle root is read-only (it may hold the .env); jobs.yaml and
      # connections.yaml live in the catalog/ subdirectory, mounted read-write
      # so the web interface can save them. The container starts degraded but
      # healthy while the files are missing.
      - ${QI_CONFIG_DIR:-./config}:/config:ro
      - ${QI_CONFIG_DIR:-./config}/catalog:/config/catalog
    depends_on:
      - tika

  tika:
    image: docker.io/apache/tika:3.2.3.0
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx${QI_TIKA_HEAP:-2g}"

volumes:
  qi-cache:
  qi-state:
