# Starting point for the connection list. Copy to the directory mounted at
# QI_CONNECTIONS_FILE (default /config/catalog/connections.yaml) and adapt.
#
# api_key is never written here in the clear: it is an encrypted token
# (enc:1:...) derived from QI_CONNECTIONS_SECRET. Omit it for an unauthenticated
# Qdrant. See docs/connections.md for how to produce the token.
version: 1

connections:
  - name: primary
    url: http://host.docker.internal:6333
    # api_key: enc:1:...   # see docs/connections.md
